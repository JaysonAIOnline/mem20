[pytest]
# The nested mem20 packages live at <project>/<name>/, so the outer project
# directory shadows the real package as a namespace package. pytest's default
# "prepend" import mode inserts the outer directory at sys.path[0], which
# produces:
#
#   ImportError: cannot import name 'ActionSpec' from 'mem20unitiz'
#                (unknown location)
#
# "importlib" mode imports by module path without that sys.path surgery.
# conftest.py additionally puts each project root on sys.path so in-place
# imports resolve when the package is not pip-installed.
addopts = --import-mode=importlib
# Default to the whole estate.
#
# This used to list three packages, so a bare `pytest` in /opt/mem20 ran 132 tests
# and reported green while 1,400+ tests in the other packages never executed. A
# default that under-reports is worse than no default: it looks like coverage.
# "." collects every package's tests through the root conftest, which is what puts
# each project root on sys.path. Use `pytest <package>` to narrow it.
testpaths = .
norecursedirs = .git .venv venv node_modules __pycache__ site-packages secrets backups data store build dist mem
