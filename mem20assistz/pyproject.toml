[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20assistz"
version = "0.1.0"
description = "mem20 companion, coach and assistant runtime — crew runtime grouping reviewed packages for joint integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "integration"]
dependencies = []

[project.scripts]
mem20assistz = "mem20assistz.cli:main"

[tool.setuptools]
packages = ["mem20assistz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
