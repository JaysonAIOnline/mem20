[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20remotedevicerepairz"
version="1.0.0"
description='Diagnose configuration, storage, network, and application faults and apply bounded fixes'
requires-python=">=3.11"

[project.scripts]
mem20remotedevicerepairz="mem20remotedevicerepairz.core:cli"

[tool.setuptools]
packages=["mem20remotedevicerepairz"]
[tool.setuptools.package-data]
mem20remotedevicerepairz=["roadmap.json"]
