[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20unitiz"
version = "0.2.0"
description = "A real reinforcement-learning toolkit with grid environments, PPO, DQN, SAC, and cooperative PPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
mem20unitiz = "mem20unitiz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20unitiz*"]

[tool.pytest.ini_options]
testpaths = ["mem20unitiz/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
