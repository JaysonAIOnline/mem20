[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20multichannelcommandstreamz"
version="1.0.0"
description='Unify commands arriving from chat, voice, devices, webhooks, and spatial interfaces'
requires-python=">=3.11"

[project.scripts]
mem20multichannelcommandstreamz="mem20multichannelcommandstreamz.core:cli"

[tool.setuptools]
packages=["mem20multichannelcommandstreamz"]
[tool.setuptools.package-data]
mem20multichannelcommandstreamz=["roadmap.json"]
