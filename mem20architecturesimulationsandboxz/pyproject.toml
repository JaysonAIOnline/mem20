[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20architecturesimulationsandboxz"
version="1.0.0"
description='Execute proposed service boundaries and traffic patterns against synthetic load'
requires-python=">=3.11"

[project.scripts]
mem20architecturesimulationsandboxz="mem20architecturesimulationsandboxz.core:cli"

[tool.setuptools]
packages=["mem20architecturesimulationsandboxz"]
[tool.setuptools.package-data]
mem20architecturesimulationsandboxz=["roadmap.json"]
