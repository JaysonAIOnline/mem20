[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20livecodeknowledgegraphz"
version="1.0.0"
description='Maintain a continuously updated graph of symbols, calls, data ownership, and runtime behavior'
requires-python=">=3.11"

[project.scripts]
mem20livecodeknowledgegraphz="mem20livecodeknowledgegraphz.core:cli"

[tool.setuptools]
packages=["mem20livecodeknowledgegraphz"]
[tool.setuptools.package-data]
mem20livecodeknowledgegraphz=["roadmap.json"]
