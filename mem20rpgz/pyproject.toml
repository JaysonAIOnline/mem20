[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20rpgz"
version = "0.1.0"
description = "Native mem20 RPGAgent absorption — stats, combat, inventory, quests, world, multi-agent story-to-play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
mem20rpgz = "mem20rpgz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20rpgz*"]

[tool.ruff]
target-version = "py311"
line-length = 100