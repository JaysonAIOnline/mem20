[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20autouez"
version = "0.1.0"
description = "Native mem20 AutoUE absorption — Unreal Engine automation, Python API, asset pipeline, blueprint generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pydantic>=2.8",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
mem20autouez = "mem20autouez.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20autouez*"]

[tool.ruff]
target-version = "py311"
line-length = 100