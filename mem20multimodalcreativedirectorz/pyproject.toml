[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20multimodalcreativedirectorz"
version="1.0.0"
description='Coordinate image, video, audio, copy, motion, and 3D generation toward one creative goal'
requires-python=">=3.11"

[project.scripts]
mem20multimodalcreativedirectorz="mem20multimodalcreativedirectorz.core:cli"

[tool.setuptools]
packages=["mem20multimodalcreativedirectorz"]
[tool.setuptools.package-data]
mem20multimodalcreativedirectorz=["roadmap.json"]
