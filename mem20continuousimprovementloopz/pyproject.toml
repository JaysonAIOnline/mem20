[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20continuousimprovementloopz"
version="1.0.0"
description='Convert observed failures and friction into ranked executable improvement experiments'
requires-python=">=3.11"

[project.scripts]
mem20continuousimprovementloopz="mem20continuousimprovementloopz.core:cli"

[tool.setuptools]
packages=["mem20continuousimprovementloopz"]
[tool.setuptools.package-data]
mem20continuousimprovementloopz=["roadmap.json"]
