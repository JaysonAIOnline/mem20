[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20safepatchsynthesisz"
version="1.0.0"
description='Generate minimal patches constrained by tests, interfaces, and blast-radius limits'
requires-python=">=3.11"

[project.scripts]
mem20safepatchsynthesisz="mem20safepatchsynthesisz.core:cli"

[tool.setuptools]
packages=["mem20safepatchsynthesisz"]
[tool.setuptools.package-data]
mem20safepatchsynthesisz=["roadmap.json"]
