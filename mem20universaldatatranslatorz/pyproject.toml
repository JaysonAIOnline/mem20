[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20universaldatatranslatorz"
version="1.0.0"
description='Map records, events, documents, and objects between incompatible systems'
requires-python=">=3.11"

[project.scripts]
mem20universaldatatranslatorz="mem20universaldatatranslatorz.core:cli"

[tool.setuptools]
packages=["mem20universaldatatranslatorz"]
[tool.setuptools.package-data]
mem20universaldatatranslatorz=["roadmap.json"]
