[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20missionroutingcockpitz"
version="1.0.0"
description='See and control every live mission, dependency, agent, and route in one place'
requires-python=">=3.11"

[project.scripts]
mem20missionroutingcockpitz="mem20missionroutingcockpitz.core:cli"

[tool.setuptools]
packages=["mem20missionroutingcockpitz"]
[tool.setuptools.package-data]
mem20missionroutingcockpitz=["roadmap.json"]
