[workspace]
resolver = "2"
members = [
    "braid_core",
    "braid_keys",
    "braid_wire",
    "braid_ui_bridge",
    "braid_drive",
    "braid_her",
    "braid_sonic",
    "braid_cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
bs58 = "0.5"

[profile.release]
opt-level = 3