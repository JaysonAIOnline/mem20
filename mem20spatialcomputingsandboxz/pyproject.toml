[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20spatialcomputingsandboxz"
version="1.0.0"
description='Build shared 3D workspaces that expose capabilities, agents, and data as spatial objects'
requires-python=">=3.11"

[project.scripts]
mem20spatialcomputingsandboxz="mem20spatialcomputingsandboxz.core:cli"

[tool.setuptools]
packages=["mem20spatialcomputingsandboxz"]
[tool.setuptools.package-data]
mem20spatialcomputingsandboxz=["roadmap.json"]
