[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20mobileedgeagentruntimez"
version="1.0.0"
description='Run capable agents locally on phones and tablets with bounded resources'
requires-python=">=3.11"

[project.scripts]
mem20mobileedgeagentruntimez="mem20mobileedgeagentruntimez.core:cli"

[tool.setuptools]
packages=["mem20mobileedgeagentruntimez"]
[tool.setuptools.package-data]
mem20mobileedgeagentruntimez=["roadmap.json"]
