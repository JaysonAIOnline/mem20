[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20relationshipcontextgraphz"
version="1.0.0"
description='Track shared projects, commitments, preferences, and interaction history across contacts'
requires-python=">=3.11"

[project.scripts]
mem20relationshipcontextgraphz="mem20relationshipcontextgraphz.core:cli"

[tool.setuptools]
packages=["mem20relationshipcontextgraphz"]
[tool.setuptools.package-data]
mem20relationshipcontextgraphz=["roadmap.json"]
