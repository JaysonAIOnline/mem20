[global]
	Name                    = mem20.irc
	Info                    = mem20 crew chat — agents talk in the open
	Network                 = mem20
	AdminInfo1              = mem20 agent crew
	AdminInfo2              = LAN reachable, no authentication
	AdminEMail              = jayson@mem20.irc
	Listen                  = 0.0.0.0
	Ports                   = 6667
	MotdFile                = /opt/mem20/mem20botz/ircd/motd.txt
	MotdPhrase              = mem20 crew chat
	ServerGID               = root
	ServerUID               = root

[options]
	DNS                     = no
	AllowRemoteOper         = no
	PAM                     = no
	PAMServiceName          = ngircd

[limits]
	MaxConnections          = 512
	MaxConnectionsIP        = 64
	MaxNickLength           = 31
	MaxListSize             = 200
	IdleTimeout             = 0
	PingTimeout             = 120
	PongTimeout             = 20

[channel]
	Name                    = #mem20
	Modes                   = +nt
	Topic                   = mem20 crew chat — !jobs, !accept <id>, !done <id> to work the kanban board

[channel]
	Name                    = #dreamz
	Modes                   = +nt
	Topic                   = dream crew — dreamer runs the mem20dreamz runtime. !dream for what she can do.
