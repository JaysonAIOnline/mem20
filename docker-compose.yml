services:
  mem20:
    build: .
    image: mem20:2.1.0-rc2
    container_name: mem20
    restart: unless-stopped
    environment:
      MEM20_HEALTH_PORT: "8080"
      # Override to point at a host path, e.g. /srv/mem20/store
      MEM20_STORE_PATH: /data
    ports:
      - "8080:8080"
    volumes:
      # Persist the memory store across container restarts.
      - mem20-store:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mem20-store:
