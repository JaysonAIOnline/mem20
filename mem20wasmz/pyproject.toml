[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20wasmz"
version = "1.0.0"
description = "WebAssembly component lab: language-neutral component compatibility analysis behind a shared zero-dependency runtime. mem30 Phase 4 incubator."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem20wasmz = "mem20wasmz.core:cli"

[tool.setuptools]
packages = ["mem20wasmz"]

[tool.setuptools.package-data]
mem20wasmz = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
