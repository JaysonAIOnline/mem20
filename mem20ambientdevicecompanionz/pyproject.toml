[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20ambientdevicecompanionz"
version="1.0.0"
description='Move a live session between phone, desktop, headset, vehicle, and home devices'
requires-python=">=3.11"

[project.scripts]
mem20ambientdevicecompanionz="mem20ambientdevicecompanionz.core:cli"

[tool.setuptools]
