[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20labz"
version = "0.1.0"
description = "mem20 laboratory runtime — crew runtime grouping reviewed packages for joint integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "integration"]
dependencies = []

[project.scripts]
mem20labz = "mem20labz.cli:main"

[tool.setuptools]
packages = ["mem20labz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
