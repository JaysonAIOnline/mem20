[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20releasereadinesspredictorz"
version="1.0.0"
description='Forecast whether a candidate build can survive expected load, usage, and failure conditions'
requires-python=">=3.11"

[project.scripts]
mem20releasereadinesspredictorz="mem20releasereadinesspredictorz.core:cli"

[tool.setuptools]
packages=["mem20releasereadinesspredictorz"]
[tool.setuptools.package-data]
mem20releasereadinesspredictorz=["roadmap.json"]
