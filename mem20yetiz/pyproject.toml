[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20yetiz"
version = "0.2.0"
description = "Native mem20 Yeti Claw absorption — real 3D rigging, animation, BVH mocap, glTF and OBJ export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
verify = [
    "trimesh>=4.0",
]

[project.scripts]
mem20yetiz = "mem20yetiz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20yetiz*"]

[tool.setuptools.package-data]
mem20yetiz = ["tests/fixtures/*.bvh"]

[tool.pytest.ini_options]
testpaths = ["mem20yetiz/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
