[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20pipelinez"
version = "0.1.0"
description = "mem20 production pipeline runtime for game-maker and software pipelines — crew runtime grouping reviewed packages for joint integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "integration"]
dependencies = []

[project.scripts]
mem20pipelinez = "mem20pipelinez.cli:main"

[tool.setuptools]
packages = ["mem20pipelinez"]

[tool.pytest.ini_options]
testpaths = ["tests"]
