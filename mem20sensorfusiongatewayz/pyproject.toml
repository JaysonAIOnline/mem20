[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20sensorfusiongatewayz"
version="1.0.0"
description='Normalize camera, microphone, motion, location, biometric, and environmental signals'
requires-python=">=3.11"

[project.scripts]
mem20sensorfusiongatewayz="mem20sensorfusiongatewayz.core:cli"

[tool.setuptools]
packages=["mem20sensorfusiongatewayz"]
[tool.setuptools.package-data]
mem20sensorfusiongatewayz=["roadmap.json"]
