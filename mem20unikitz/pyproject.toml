[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20unikitz"
version = "0.1.0"
description = "Native mem20 UniKit AI absorption — Behavior trees, GOAP, utility AI, navigation, perception, blackboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pydantic>=2.8",
    "numpy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
mem20unikitz = "mem20unikitz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20unikitz*"]

[tool.ruff]
target-version = "py311"
line-length = 100