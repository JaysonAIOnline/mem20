[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20realtimeexecutionmapz"
version="1.0.0"
description='Visualize work, data, and resource movement as it happens'
requires-python=">=3.11"

[project.scripts]
mem20realtimeexecutionmapz="mem20realtimeexecutionmapz.core:cli"

[tool.setuptools]
packages=["mem20realtimeexecutionmapz"]
[tool.setuptools.package-data]
mem20realtimeexecutionmapz=["roadmap.json"]
