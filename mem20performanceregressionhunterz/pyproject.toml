[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20performanceregressionhunterz"
version="1.0.0"
description='Trace code-to-resource relationships and identify the exact change causing slowdowns'
requires-python=">=3.11"

[project.scripts]
mem20performanceregressionhunterz="mem20performanceregressionhunterz.core:cli"

[tool.setuptools]
packages=["mem20performanceregressionhunterz"]
[tool.setuptools.package-data]
mem20performanceregressionhunterz=["roadmap.json"]
