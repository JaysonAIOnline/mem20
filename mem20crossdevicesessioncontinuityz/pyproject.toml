[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20crossdevicesessioncontinuityz"
version="1.0.0"
description='Move active application and agent state between devices without restarting work'
requires-python=">=3.11"

[project.scripts]
mem20crossdevicesessioncontinuityz="mem20crossdevicesessioncontinuityz.core:cli"

[tool.setuptools]
packages=["mem20crossdevicesessioncontinuityz"]
[tool.setuptools.package-data]
mem20crossdevicesessioncontinuityz=["roadmap.json"]
