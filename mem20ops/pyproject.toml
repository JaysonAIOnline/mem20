[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20ops"
version = "0.1.0"
description = "Reusable mem20 operational workflows: Cloudflare zone/Pages audits, stale-code detection, bounded verification, identity and namespace ACL inspection, lint deltas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "ops", "cloudflare", "dns", "verification", "audit"]
dependencies = []

[project.scripts]
fs-ops = "mem20ops.cli:main"
fs = "mem20ops.fleet:main"

# src/ layout, like mem20sitemapz and mem20temporaldatabasefabricz. With the
# package beside pyproject.toml, the project directory shadows the installed
# package whenever cwd is /opt/mem20: the top-level import resolves to an implicit
# namespace package (__file__ is None) and pkgutil.iter_modules then reports one
# useless submodule named "mem20ops" instead of audit/cli/clicheck/cloudflare/
# fleet/memchecks/runtime. Submodule imports still worked via setuptools' editable
# finder, which is why this went unnoticed.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
