[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20ocaskz"
version = "0.1.0"
description = "mem20 opencode feature-ask auditor — mines opencode's own session database for the feature requests Jayson actually made, classifies them by theme, and emits a traceable index. Read-only against the database: never mutates a session."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "opencode", "sessions", "audit", "requirements", "gui"]
dependencies = []

[project.scripts]
mem20ocaskz = "mem20ocaskz.cli:main"

[tool.setuptools]
packages = ["mem20ocaskz"]

[tool.pytest.ini_options]
testpaths = ["tests"]