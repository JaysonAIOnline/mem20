[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20graphz"
version = "0.1.0"
description = "mem20 graph systems runtime — crew runtime grouping reviewed packages for joint integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "crew", "runtime", "integration"]
dependencies = []

[project.scripts]
mem20graphz = "mem20graphz.cli:main"

[tool.setuptools]
packages = ["mem20graphz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
