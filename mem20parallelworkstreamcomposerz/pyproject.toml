[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20parallelworkstreamcomposerz"
version="1.0.0"
description='Split features into independent streams with precise merge points'
requires-python=">=3.11"

[project.scripts]
mem20parallelworkstreamcomposerz="mem20parallelworkstreamcomposerz.core:cli"

[tool.setuptools]
packages=["mem20parallelworkstreamcomposerz"]
[tool.setuptools.package-data]
mem20parallelworkstreamcomposerz=["roadmap.json"]
