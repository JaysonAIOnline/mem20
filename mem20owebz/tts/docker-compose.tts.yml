# Local high-quality TTS for Jayson
# Supports Kokoro and Piper via an OpenAI-compatible API

services:
  jayson-tts:
    image: ghcr.io/remsky/kokoro-fastapi:latest   # good default, OpenAI-compatible
    # Alternative: voicebox or piper-specific images
    container_name: jayson-tts
    ports:
      - "8880:8880"
    environment:
      - TZ=UTC
    volumes:
      - tts-cache:/root/.cache
    restart: unless-stopped

  # Optional: Piper (very fast, lighter)
  # jayson-piper:
  #   image:  theoradec/piper-http:latest
  #   ports:
  #     - "5000:5000"
  #   restart: unless-stopped

volumes:
  tts-cache:
