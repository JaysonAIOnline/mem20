<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mem20 chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8a92a6; --acc:#4f8cff; --ok:#3fb97f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .title { font-weight:600; letter-spacing:0.4px; }
  header .title b { color:var(--acc); }
  header select { margin-left:auto; background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  #status { color:var(--dim); font-size:12px; }
  main { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:70%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; animation:fade .15s ease; }
  .user { align-self:flex-end; background:var(--acc); color:#0b1020; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .sys { align-self:center; color:var(--dim); font-size:12px; max-width:90%; }
  footer { display:flex; gap:10px; padding:12px 20px; border-top:1px solid var(--line); background:var(--panel); }
  textarea { flex:1; resize:none; background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  button { background:var(--acc); color:#0b1020; border:0; border-radius:10px; padding:10px 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .err { color:#ff7b7b; }
  .empty { align-self:center; color:var(--dim); margin-top:20vh; text-align:center; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<header>
  <div class="title">mem<b>20</b> chat</div>
  <span id="status">loading models…</span>
  <select id="model">
    <option value="">fast (default)</option>
  </select>
</header>
<main id="main">
  <div class="empty">Say hello — this chat runs natively inside mem20 (no docker, no Open WebUI).</div>
</main>
<footer>
  <textarea id="input" rows="2" placeholder="Message mem20…  (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">Send</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const main = $('main'), input = $('input'), send = $('send'), sel = $('model'), statusEl = $('status');

async function loadModels() {
  try {
    const r = await fetch('/v1/models');
    const j = await r.json();
    const ids = (j.data || []).map(m => m.id);
    sel.innerHTML = '';
    for (const id of ids) {
      const o = document.createElement('option');
      o.value = id; o.textContent = id;
      if (id === 'fast') o.selected = true;
      sel.appendChild(o);
    }
    statusEl.textContent = ids.length ? `${ids.length} models via mem20 gateway` : 'gateway up, 0 keyed models';
  } catch (e) {
    statusEl.textContent = 'gateway unreachable';
  }
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = role === 'user' ? 'msg user' : 'msg bot';
  el.textContent = text;
  main.appendChild(el);
  main.scrollTop = main.scrollHeight;
  return el;
}

async function sendChat() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const model = sel.value;
  addMsg('user', text);
  const placeholder = addMsg('bot', '…');
  send.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model })
    });
    const j = await r.json();
    if (j.error) { placeholder.textContent = 'error: ' + j.error; placeholder.classList.add('err'); }
    else placeholder.textContent = j.reply || '(empty reply)';
  } catch (e) {
    placeholder.textContent = 'network error: ' + e.message;
    placeholder.classList.add('err');
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener('click', sendChat);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
loadModels();
input.focus();
</script>
</body>
</html>
