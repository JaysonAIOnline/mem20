router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - fast: ["balanced", "strong"]
    - balanced: ["strong", "fast"]
    - strong: ["balanced", "fast"]
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  disable_auth: true
  database_url: "os.environ/DATABASE_URL"
