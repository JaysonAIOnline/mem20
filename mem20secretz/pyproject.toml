[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20secretz"
version = "0.1.0"
description = "mem20 secrets governance — detect floating credentials that have escaped the central store, classify leak vs config duplication, and report git-exposure risk. Read-only: never mutates stored data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "secrets", "security", "audit", "redaction"]
dependencies = []

[project.scripts]
mem20secretz = "mem20secretz.cli:main"

# src/ layout, like mem20sitemapz and mem20temporaldatabasefabricz. With the
# package beside pyproject.toml, the project directory shadows the installed
# package whenever cwd is /opt/mem20: the top-level import resolves to an implicit
# namespace package (__file__ is None) and pkgutil.iter_modules then reports one
# useless submodule named "mem20secretz" instead of cli/sweep.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
