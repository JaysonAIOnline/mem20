[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20interactivecampaignbuilderz"
version="1.0.0"
description='Create campaigns whose media and experiences react to audience behavior'
requires-python=">=3.11"

[project.scripts]
mem20interactivecampaignbuilderz="mem20interactivecampaignbuilderz.core:cli"

[tool.setuptools]
packages=["mem20interactivecampaignbuilderz"]
[tool.setuptools.package-data]
mem20interactivecampaignbuilderz=["roadmap.json"]
