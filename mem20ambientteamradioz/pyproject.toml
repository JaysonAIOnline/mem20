[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20ambientteamradioz"
version="1.0.0"
description='Create lightweight always-available audio presence with intelligent interruption control'
requires-python=">=3.11"

[project.scripts]
mem20ambientteamradioz="mem20ambientteamradioz.core:cli"

[tool.setuptools]
packages=["mem20ambientteamradioz"]
[tool.setuptools.package-data]
mem20ambientteamradioz=["roadmap.json"]
