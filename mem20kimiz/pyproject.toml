[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20kimiz"
version = "0.1.0"
description = "mem20kimiz — native Kimi Agent Swarm substrate for mem20 (parallel subagent fan-out, rate-limit-aware batched scheduling, resume, ordered result contract)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["mem20kimiz*"]