[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="mem20characterandmascotforgez"
version="1.0.0"
description='Design consistent characters with appearance, voice, motion, behavior, and memory'
requires-python=">=3.11"

[project.scripts]
