[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mem20aionbordz"
version = "0.1.0"
description = "Generate verified onboarding packs for newly-hired mem20 agents: hire guide, orientation, governance, self-model setup, and pinned-block delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mem20", "onboarding", "agents", "governance", "self-model", "handoff"]
dependencies = []

[project.scripts]
mem20aionbordz = "mem20AIonbordz.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["mem20AIonbordz"]

[tool.pytest.ini_options]
testpaths = ["tests"]